version: "3.8"

services:

  # BAZE DE DATE

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  content-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: content_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - content-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  progress-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: progress_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - progress-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d progress_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  chatbot-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chatbot-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  flashcard-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flashcard_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - flashcard-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashcard_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  analysis-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: text_analysis_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - analysis-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d text_analysis_database"]
      interval: 10s
      timeout: 5s
      retries: 5






  # MICROSERVICII JAVA

  user-service:
    build:
      context: ./user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET}
      APPLICATION_SECURITY_JWT_EXPIRATION: 86400000
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - app-network

  content-service:
    build:
      context: ./content-service
    ports:
      - "8081:8081"   # expus direct — necesar pentru URL-urile fisierelor uploadate
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://content-db:5432/content_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_UPLOAD_DIR: uploads
      STORAGE_BASE_URL: http://localhost:8081
    volumes:
      - content-uploads:/app/uploads
    depends_on:
      content-db:
        condition: service_healthy
    networks:
      - app-network

  progress-service:
    build:
      context: ./progress-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://progress-db:5432/progress_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CONTENT_SERVICE_URL: http://content-service:8081
    depends_on:
      progress-db:
        condition: service_healthy
      content-service:
        condition: service_started
    networks:
      - app-network

  chatbot-service:
    build:
      context: ./chatbot-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://chatbot-db:5432/chatbot_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      chatbot-db:
        condition: service_healthy
    networks:
      - app-network

  flashcard-service:
    build:
      context: ./flashcard-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://flashcard-db:5432/flashcard_database
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      flashcard-db:
        condition: service_healthy
    networks:
      - app-network






  # TEXT ANALYSIS SERVICE — Python / FastAPI

  text-analysis-service:
    build:
      context: ./text-analysis-service
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@analysis-db:5432/text_analysis_database
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
    volumes:
      - easyocr-models:/root/.EasyOCR   # modele EasyOCR cache-uite dupa primul start
    depends_on:
      analysis-db:
        condition: service_healthy
    networks:
      - app-network





  # API GATEWAY

  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APPLICATION_SECURITY_JWT_SECRET_KEY: ${JWT_SECRET}
    depends_on:
      - user-service
      - content-service
      - progress-service
      - chatbot-service
      - flashcard-service
      - text-analysis-service
    networks:
      - app-network





  # FRONTEND — Nginx


  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - app-network





# VOLUMES


volumes:
  user-db-data:
  content-db-data:
  progress-db-data:
  chatbot-db-data:
  flashcard-db-data:
  analysis-db-data:
  content-uploads:
  easyocr-models:





# NETWORKS

networks:
  app-network:
    driver: bridge