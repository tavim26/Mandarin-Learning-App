# nginx.conf — pune-l în rădăcina proiectului frontend
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Toate rutele necunoscute → index.html (React Router le gestionează)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy către API Gateway — evită probleme CORS în producție
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}