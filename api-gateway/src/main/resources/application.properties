server.port=8080
spring.application.name=api-gateway

# JWT ? secret partajat cu user-service (HS256)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Rute ? user-service (port 8082)
# Autentificarea publica nu trece prin filtrul JWT
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8082
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# Rute ? content-service (port 8081)
spring.cloud.gateway.routes[1].id=content-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/content/**

# Rute ? progress-service (port 8083)
spring.cloud.gateway.routes[2].id=progress-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/progress/**

# Rute ? chatbot-service (port 8084)
spring.cloud.gateway.routes[3].id=chatbot-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/chatbot/**

# Rute ? text-analysis-service / FastAPI (port 8085)
spring.cloud.gateway.routes[4].id=analysis-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/analysis/**

# Rute ? flashcard-service (port 8086)
spring.cloud.gateway.routes[5].id=flashcard-service
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/flashcards/**


