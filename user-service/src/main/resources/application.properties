spring.application.name=user-service
# Port diferit fata de Content Service
server.port=8082

# DATABASE CONFIGURATION
# Numele bazei va fi 'user_database'
spring.datasource.url=jdbc:postgresql://localhost:5432/user_database
spring.datasource.username=postgres
spring.datasource.password=kuso
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SECURITY LOGGING (Optional, ajuta la debug)
logging.level.org.springframework.security=INFO

# JWT Configuration
# Cheie secreta de 256 biti (hex)
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000


# RABBITMQ CONFIGURATION
# Connection settings (default local RabbitMQ)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Exchange name for user-related events
rabbitmq.exchange.user-events=user.events.exchange

# Routing keys for different event types
rabbitmq.routing-key.student-created=student.created
rabbitmq.routing-key.student-deleted=student.deleted
rabbitmq.routing-key.student-updated=student.updated

# Enable message acknowledgments and retries
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3