spring.application.name=user-service
# Port diferit fata de Content Service
server.port=8082

# DATABASE CONFIGURATION
# Numele bazei va fi 'user_database'
spring.datasource.url=jdbc:postgresql://localhost:5432/user_database
spring.datasource.username=postgres
spring.datasource.password=kuso
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SECURITY LOGGING (Optional, ajuta la debug)
logging.level.org.springframework.security=INFO

